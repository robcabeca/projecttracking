
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:oklch(0.95 0.006 80);font-family:'Hanken Grotesk',system-ui,sans-serif;color:oklch(0.28 0.01 60);-webkit-font-smoothing:antialiased;min-height:100vh}
::placeholder{color:oklch(0.7 0.01 80)}
select{-webkit-appearance:none;appearance:none;cursor:pointer;font-family:inherit;outline:none}
textarea{font-family:inherit}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

.wrap{max-width:1340px;margin:0 auto;padding:44px 44px 120px}

/* header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:30px}
.hdr-eyebrow{font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:0.16em;text-transform:uppercase;color:oklch(0.58 0.13 40);margin-bottom:10px}
.hdr h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:44px;line-height:1.2;margin:0 0 10px;color:oklch(0.22 0.01 60)}
.hdr-sub{font-size:14px;color:oklch(0.5 0.01 60)}
.hdr-sub span{color:oklch(0.62 0.01 60)}
.hdr-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.btn-secondary{display:inline-flex;align-items:center;gap:7px;background:white;color:oklch(0.35 0.01 60);border:1px solid oklch(0.88 0.006 80);border-radius:11px;padding:11px 15px;font-size:14px;font-weight:600;cursor:pointer}
.btn-secondary:hover{border-color:oklch(0.7 0.01 80);background:oklch(0.98 0.004 80)}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:oklch(0.24 0.01 60);color:oklch(0.97 0.005 80);border:none;border-radius:11px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer}
.btn-primary:hover{background:oklch(0.34 0.01 60)}

/* save state */
.savestate{font-family:'DM Mono',monospace;font-size:11px;color:oklch(0.55 0.01 60);padding:0 4px}
.gear-btn{background:white;border:1px solid oklch(0.88 0.006 80);border-radius:8px;padding:7px 10px;font-size:16px;cursor:pointer;color:oklch(0.45 0.01 60)}
.gear-btn:hover{border-color:oklch(0.7 0.01 80)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.tile{background:oklch(0.985 0.003 90);border:1px solid oklch(0.91 0.006 80);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.tile-n{font-family:'Instrument Serif',serif;font-size:48px;line-height:0.95}
.tile-l{font-size:13px;color:oklch(0.5 0.01 60)}

/* toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.search-box{display:flex;align-items:center;gap:9px;background:white;border:1px solid oklch(0.89 0.006 80);border-radius:10px;padding:9px 13px;min-width:280px;flex:1;max-width:420px}
.search-box input{border:none;outline:none;background:transparent;font-size:14px;width:100%;color:oklch(0.28 0.01 60)}
.search-icon{width:14px;height:14px;border:1.8px solid oklch(0.62 0.01 80);border-radius:50%;flex-shrink:0}
.sort-wrap{display:flex;align-items:center;gap:9px}
.sort-wrap span{font-size:13px;color:oklch(0.55 0.01 60)}
.sort-select{background:white;border:1px solid oklch(0.89 0.006 80);border-radius:10px;padding:9px 30px 9px 13px;font-size:14px;color:oklch(0.3 0.01 60);font-weight:500;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M1 1l4 4 4-4" stroke="%23999" stroke-width="1.5" fill="none"/></svg>');background-repeat:no-repeat;background-position:right 12px center}

/* chips */
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip-divider{width:1px;height:20px;background:oklch(0.88 0.006 80);flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;border:1px solid oklch(0.9 0.006 80);background:white;color:oklch(0.45 0.01 60)}
.chip.active{background:oklch(0.92 0.01 60);border-color:oklch(0.7 0.01 60);color:oklch(0.3 0.04 60)}
.chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chip-count{opacity:0.55;font-family:'DM Mono',monospace;font-size:11.5px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(306px,1fr));gap:15px;align-items:start}
.card{background:white;border:1px solid oklch(0.91 0.006 80);border-radius:15px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:11px;box-shadow:0 1px 2px oklch(0.6 0.01 80 / 0.04)}
.card-high-border{border-color:oklch(0.85 0.09 28)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-meta{display:flex;align-items:center;gap:9px;min-width:0}
.cat-label{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.01 60)}
.cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.card-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.status-select{font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;border:1px solid}
.delete-btn{border:none;background:transparent;cursor:pointer;padding:3px;line-height:0;color:oklch(0.74 0.01 80);border-radius:6px;display:inline-flex;align-items:center}
.delete-btn:hover{color:oklch(0.52 0.16 28);background:oklch(0.95 0.04 28)}
.prio-btn{border:none;background:transparent;cursor:pointer;padding:0;font-size:13px;line-height:1}
.card-title{border:none;outline:none;background:transparent;font-family:'Instrument Serif',serif;font-size:25px;line-height:1.1;color:oklch(0.23 0.01 60);width:100%;padding:1px 0}
.card-title:focus{background:oklch(0.97 0.006 80);border-radius:4px}
.progress-row{display:flex;align-items:center;gap:10px}
.progress-bar{flex:1;height:6px;border-radius:99px;background:oklch(0.92 0.006 80);overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:oklch(0.58 0.13 40);transition:width 0.3s}
.progress-label{font-family:'DM Mono',monospace;font-size:11px;color:oklch(0.5 0.01 60);white-space:nowrap}
.tasks{display:flex;flex-direction:column;gap:3px}
.task-row{display:flex;align-items:center;gap:9px;padding:2px 0}
.task-row:hover{background:oklch(0.975 0.004 80)}
.task-check{width:15px;height:15px;border-radius:5px;border:1.5px solid oklch(0.82 0.006 80);background:transparent;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font-size:10px;line-height:1}
.task-check.done{background:oklch(0.55 0.13 150);border-color:oklch(0.55 0.13 150)}
.task-input{border:none;outline:none;background:transparent;font-size:13px;width:100%;padding:2px 0;color:oklch(0.36 0.01 60)}
.task-input.done{color:oklch(0.68 0.01 80);text-decoration:line-through}
.task-input:focus{background:oklch(0.97 0.006 80)}
.task-del{border:none;background:transparent;cursor:pointer;color:oklch(0.78 0.01 80);font-size:15px;line-height:1;padding:0 2px;flex-shrink:0}
.task-del:hover{color:oklch(0.55 0.14 28)}
.empty-note{font-size:12.5px;color:oklch(0.62 0.01 60);font-style:italic}
.card-footer{display:flex;align-items:center;gap:14px}
.toggle-btn{border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:600;color:oklch(0.55 0.02 40);padding:0;white-space:nowrap}
.details-btn{border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:600;color:oklch(0.55 0.01 60);padding:0;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.details-btn:hover{color:oklch(0.35 0.01 60)}
.add-row{display:flex;align-items:center;gap:8px;border-top:1px solid oklch(0.94 0.006 80);padding-top:9px;margin-top:1px}
.add-icon{color:oklch(0.7 0.01 80);font-size:15px;line-height:0}
.add-input{border:none;outline:none;background:transparent;font-size:13px;width:100%;padding:2px 0;color:oklch(0.4 0.01 60)}
.details-panel{display:flex;flex-direction:column;gap:11px;border-top:1px solid oklch(0.94 0.006 80);padding-top:12px;margin-top:1px}
.details-row{display:flex;gap:10px}
.field{flex:1;display:flex;flex-direction:column;gap:4px}
.field-label{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.58 0.01 60)}
.field select,.field textarea{border:1px solid oklch(0.89 0.006 80);border-radius:8px;padding:7px 10px;font-size:13px;color:oklch(0.3 0.01 60);background:white;outline:none}
.field textarea{resize:vertical;line-height:1.45}
.del-link{align-self:flex-start;border:none;background:transparent;cursor:pointer;font-size:12px;color:oklch(0.6 0.08 28);padding:0}
.del-link:hover{color:oklch(0.5 0.16 28)}
.add-card{border:1.5px dashed oklch(0.83 0.01 80);border-radius:15px;min-height:180px;display:flex;align-items:center;justify-content:center;gap:8px;color:oklch(0.56 0.01 60);font-size:14px;font-weight:500;cursor:pointer}
.add-card:hover{border-color:oklch(0.58 0.13 40);color:oklch(0.5 0.08 40)}
.empty-state{text-align:center;padding:60px 20px;color:oklch(0.55 0.01 60);font-size:15px}
.empty-state span{color:oklch(0.58 0.13 40);cursor:pointer;font-weight:600}

/* settings modal */
.modal-bg{position:fixed;inset:0;background:rgba(32,36,43,.4);z-index:30;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:14px;padding:28px;width:min(480px,92vw);box-shadow:0 8px 40px rgba(0,0,0,.15)}
.modal h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:26px;margin:0 0 6px;color:oklch(0.22 0.01 60)}
.modal p{font-size:13px;color:oklch(0.5 0.01 60);margin:0 0 20px}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:oklch(0.55 0.01 60);margin-bottom:5px}
.modal-field input{width:100%;padding:9px 11px;border:1px solid oklch(0.88 0.006 80);border-radius:8px;font-size:14px;font-family:inherit;color:oklch(0.28 0.01 60)}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.modal-msg{margin-top:12px;font-size:13px}

@media(max-width:640px){
  .wrap{padding:20px 14px 80px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .hdr h1{font-size:30px}
  .tile-n{font-size:34px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="hdr">
    <div>
      <div class="hdr-eyebrow">Project Tracker</div>
      <h1>Everything I'm building</h1>
      <div class="hdr-sub" id="subtitle">Loading… <span></span></div>
    </div>
    <div class="hdr-actions">
      <span class="savestate" id="saveState">loading…</span>
      <button class="gear-btn" onclick="openSettings()" title="GitHub Gist settings">⚙</button>
      <button class="btn-secondary" onclick="exportBackup()"><span>↓</span> Backup</button>
      <label class="btn-secondary"><span>↑</span> Restore<input type="file" accept=".json" onchange="importBackup(event)" style="display:none"></label>
      <button class="btn-primary" onclick="addProject()"><span style="font-size:17px;line-height:0">+</span> New project</button>
    </div>
  </div>

  <!-- STAT TILES -->
  <div class="tiles" id="tiles"></div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-box">
      <div class="search-icon"></div>
      <input id="searchInput" placeholder="Search projects and tasks…" oninput="onSearch(this.value)">
    </div>
    <div class="sort-wrap">
      <span>Sort</span>
      <select class="sort-select" id="sortSelect" onchange="onSort(this.value)">
        <option value="status">Status · active first</option>
        <option value="priority">Priority · high first</option>
        <option value="alpha">Name · A to Z</option>
        <option value="open">Most open tasks</option>
        <option value="progress">Progress · % done</option>
      </select>
    </div>
  </div>

  <!-- FILTER CHIPS -->
  <div class="chips" id="chips"></div>

  <!-- CARD GRID -->
  <div class="grid" id="grid"></div>

</div>

<script>
/* ====== Seed data ====== */
const SEED = [{"n":"choco chef","c":"Business","s":"Active","pr":"High","t":["finish choc course","publish choco course","create avatars","create copy","post all blogs","business plan","roles and responsibilities","DBA name and re-register license","certify new kitchen","create a course offer and landing page","create order bump","create oto 1","create oto 2","sell the course","send emails to list","promote course for valentines day","create many videos for fb inst yt li of buying chocolate etc","create workbook","create ancillary materials","chef jacket","bonuses","mentoring monthly with bonuses"]},{"n":"music","c":"Creative","s":"Active","pr":"Medium","t":["sing gold rush in clown","tune sitar","tune guitar","set up recording system","upload all recordings from phone","record songs, post on bandcamp","melvin to help set up recording again","start recording songs"]},{"n":"Deep Being","c":"Creative","s":"Active","pr":"Medium","t":["create ebook","update to include corporate documentary sale","Create season 2","sm content","write draft of shows I want","ebeneezer","fix user signups","audio book","videos","sales offer letter","Edit pride video","music videos","Edit Local Biz Network Video"]},{"n":"I Let Him Be","c":"Creative","s":"Active","pr":"High","t":["create landing page","set up funnel","order bump - audio book","create audio book","fix smashwords version"]},{"n":"MBH","c":"Business","s":"Active","pr":"High","t":["create site","add products","create offer","order bump","oto 1","oto 2","advertise","social media posts","create ebooks","audio books","videos","social media"]},{"n":"Craving Serenity","c":"Business","s":"Active","pr":"Medium","t":["create site","ebook","audio book","videos","offer page","social media"]},{"n":"GHL","c":"Business","s":"Active","pr":"Medium","t":["Contact Milan","get it all set up right","take 5 day training","sell services","Pay bill"]},{"n":"Habit Finder","c":"Business","s":"Active","pr":"Medium","t":["update score matrix spreadsheet","add structure and instructions","send update to Tobi","Ask for compensation…"]},{"n":"Insight Timer","c":"Creative","s":"Active","pr":"Medium","t":["create more meditations of varying lengths","create some courses","schedule 2 or 3 live events each week for 30 minutes","socialize the live events and meditations","may need to update some meditations"]},{"n":"April and Cliff","c":"Personal","s":"Idea","pr":"Low","t":[]},{"n":"Paul Martinelli","c":"Personal","s":"Idea","pr":"Low","t":[]},{"n":"Jim Edwards","c":"Business","s":"Active","pr":"Medium","t":["set up affiliate links","market affiliate with videos and content"]},{"n":"Coaches Helper","c":"Business","s":"Active","pr":"High","t":["Schedule live local events with Natalie and others","Schedule multiple weekly webinars and discussions","Business plan","business strategies","business Q&A","Edit masterclass video","email video to former registrants","create ever webinar of low morale class","use it as a lead magnet","redo the funnel mechanics","create email followups for this","create mastermind upgrade","enhance the coaches calculator and create funnel for it"]},{"n":"Sites in a Day","c":"Business","s":"Active","pr":"Medium","t":["update site","migrate to ghl"]},{"n":"US Cyber Command","c":"Business","s":"Active","pr":"High","t":["update home page","create landing page for each product bundle","remove individual courses","verify all payment configurations","verify new itu set up","create new phone number","verify twilio","update whatsapp business","create new fb page or change the name of it","create instagram","youtube","create avatars","marketing content calendar","market market market","start weekly open q&a","create webinars","create mastermind offer"]},{"n":"IT Consulting","c":"Business","s":"Idea","pr":"Low","t":["cybercommanddefense.com or cyberdefensive.com"]},{"n":"Ditch the Doubt","c":"Creative","s":"Idea","pr":"Low","t":[]},{"n":"Joe Rangel","c":"Personal","s":"Idea","pr":"Low","t":[]},{"n":"Paul Blanchard","c":"Personal","s":"Idea","pr":"Low","t":[]},{"n":"PMC","c":"Business","s":"Active","pr":"Medium","t":["drama","employee manual","operating manual","job description","PSA videos"]},{"n":"Jesus for Dinner","c":"Creative","s":"Active","pr":"Medium","t":["finish book","create site"]},{"n":"ART","c":"Creative","s":"Active","pr":"Medium","t":["create few times week posts","write stories about each piece of art","update art website","artwork of the week","stories about why I paint and create"]},{"n":"Wolf In You","c":"Business","s":"Active","pr":"Medium","t":["register site","create dropship products"]},{"n":"Unicorn In You","c":"Business","s":"Idea","pr":"Low","t":[]},{"n":"masteringlife.com","c":"Business","s":"Idea","pr":"Low","t":[]},{"n":"maca","c":"Business","s":"On hold","pr":"Low","t":["market affiliate"]},{"n":"Smashwords","c":"Business","s":"Active","pr":"Medium","t":["update books formatting?"]},{"n":"Ingram Spark","c":"Business","s":"Active","pr":"Medium","t":["set up account","publish books and ebooks through here"]},{"n":"Finances","c":"Money","s":"Active","pr":"High","t":["edit spending plan","enter receipts","link all planned income","Buy new Bowker ISBNs"]},{"n":"Winning Big Lottery","c":"Money","s":"Idea","pr":"Low","t":["set up corp","set up trust","set up foundation","plan which company to use for $ management of it"]}];

/* ====== GitHub Gist storage ====== */
const GIST_FILE = 'project_tracker_data.json';
let CFG = {token:'', gistId:''};
let saveTimer = null;

function loadCfg(){ try{ const c=localStorage.getItem('pt_cfg'); if(c) CFG=JSON.parse(c); }catch(e){} }
function saveCfg(){ localStorage.setItem('pt_cfg', JSON.stringify(CFG)); }
function isConfigured(){ return !!(CFG.token && CFG.gistId); }
function setSaveState(t){ document.getElementById('saveState').textContent=t; }

async function gistGet(){
  const r=await fetch(`https://api.github.com/gists/${CFG.gistId}`,{headers:{'Authorization':`token ${CFG.token}`,'Accept':'application/vnd.github+json'}});
  if(!r.ok) throw new Error(`Gist fetch failed: ${r.status}`);
  const d=await r.json();
  const raw=d.files?.[GIST_FILE]?.content;
  return raw ? JSON.parse(raw) : null;
}

async function gistSet(data){
  const r=await fetch(`https://api.github.com/gists/${CFG.gistId}`,{method:'PATCH',headers:{'Authorization':`token ${CFG.token}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(data)}}})});
  if(!r.ok) throw new Error(`Gist save failed: ${r.status}`);
}

function scheduleSave(){
  setSaveState('saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(!isConfigured()){ setSaveState('⚙ not saved — configure Gist in settings'); return; }
    try{
      await gistSet({projects:S.projects});
      setSaveState('✓ saved  '+new Date().toLocaleTimeString());
    }catch(e){ setSaveState('✗ save error — check ⚙ settings'); console.error(e); }
  }, 800);
}

/* ====== App state ====== */
const uid = ()=>'x'+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36);
let S = {
  projects: [],
  expanded: {},
  details: {},
  filterStatus: null,
  filterCat: null,
  query: '',
  sort: 'status'
};

function seedProjects(){
  return SEED.map((p,i)=>({
    id:'p'+i, name:p.n, category:p.c, status:p.s, priority:p.pr, note:'',
    tasks:p.t.map((t,j)=>({id:'p'+i+'t'+j, t, done:false}))
  }));
}

/* ====== Lookup tables ====== */
const STATUS_ORDER = ['Active','On hold','Idea','Done'];
const CAT_ORDER = ['Business','Creative','Money','Personal'];
const STATUS_META = {
  'Active':  {color:'oklch(0.55 0.13 150)'},
  'On hold': {color:'oklch(0.68 0.13 65)'},
  'Idea':    {color:'oklch(0.58 0.09 285)'},
  'Done':    {color:'oklch(0.52 0.04 160)'}
};
const CAT_META = {
  'Business':{color:'oklch(0.62 0.1 250)'},
  'Creative':{color:'oklch(0.63 0.13 330)'},
  'Money':   {color:'oklch(0.58 0.12 145)'},
  'Personal':{color:'oklch(0.66 0.11 60)'}
};
const PRIO_META = {
  'High':   {color:'oklch(0.58 0.18 28)', glyph:'▲', rank:0},
  'Medium': {color:'oklch(0.7 0.13 70)',  glyph:'△', rank:1},
  'Low':    {color:'oklch(0.78 0.015 80)',glyph:'△', rank:2}
};

function tint(c,p){ return `color-mix(in oklab, ${c} ${p}%, white)`; }

/* ====== Mutations ====== */
function mutateP(pid,fn){ S.projects=S.projects.map(p=>p.id!==pid?p:fn({...p})); scheduleSave(); render(); }
function toggleTask(pid,tid){ mutateP(pid,p=>({...p,tasks:p.tasks.map(t=>t.id!==tid?t:{...t,done:!t.done})})); }
function deleteTask(pid,tid){ mutateP(pid,p=>({...p,tasks:p.tasks.filter(t=>t.id!==tid)})); }
function addTask(pid,text){ const id=uid(); mutateP(pid,p=>({...p,tasks:[...p.tasks,{id,t:text,done:false}]})); }
function setStatus(pid,v){ mutateP(pid,p=>({...p,status:v})); }
function setCategory(pid,v){ mutateP(pid,p=>({...p,category:v})); }
function setPriority(pid,v){ mutateP(pid,p=>({...p,priority:v})); }
function cyclePriority(pid){ const o=['High','Medium','Low']; mutateP(pid,p=>({...p,priority:o[(o.indexOf(p.priority)+1)%3]})); }
function setName(pid,v){ mutateP(pid,p=>({...p,name:v})); }
function setTaskText(pid,tid,v){ mutateP(pid,p=>({...p,tasks:p.tasks.map(t=>t.id!==tid?t:{...t,t:v})})); }
function setNote(pid,v){ mutateP(pid,p=>({...p,note:v})); }
function deleteProject(pid){ S.projects=S.projects.filter(p=>p.id!==pid); scheduleSave(); render(); }
function toggleExpand(pid){ S.expanded={...S.expanded,[pid]:!S.expanded[pid]}; render(); }
function toggleDetails(pid){ S.details={...S.details,[pid]:!S.details[pid]}; render(); }

function addProject(){
  const id=uid();
  S.projects=[{id,name:'',category:'Business',status:'Active',priority:'Medium',note:'',tasks:[]},...S.projects];
  S.expanded={...S.expanded,[id]:true};
  S.filterStatus=null; S.filterCat=null; S.query=''; S.sort='status';
  scheduleSave(); render();
  setTimeout(()=>{ const el=document.querySelector(`[data-pid="${id}"] .card-title`); if(el) el.focus(); },50);
}

function onSearch(v){ S.query=v; render(); }
function onSort(v){ S.sort=v; render(); }

/* ====== Export / Import ====== */
function exportBackup(){
  try{
    const d={app:'project-tracker',version:1,exportedAt:new Date().toISOString(),projects:S.projects};
    const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='project-tracker-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){ alert('Backup failed: '+e.message); }
}
function importBackup(e){
  const file=e.target.files&&e.target.files[0]; e.target.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      const projects=Array.isArray(parsed)?parsed:parsed.projects;
      if(!Array.isArray(projects)||!projects.length){ alert("That doesn't look like a tracker backup."); return; }
      if(!confirm(`Restore ${projects.length} projects? This replaces everything currently in the tracker.`)) return;
      S.projects=projects.map((p,i)=>({id:p.id||('p'+i),name:p.name||'Untitled',category:p.category||'Business',status:p.status||'Active',priority:p.priority||'Medium',note:p.note||'',tasks:Array.isArray(p.tasks)?p.tasks.map((t,j)=>({id:t.id||('t'+j),t:t.t||'',done:!!t.done})):[]}));
      S.expanded={}; S.filterStatus=null; S.filterCat=null; S.query=''; S.sort='status';
      scheduleSave(); render();
    }catch(err){ alert('Could not read that file: '+err.message); }
  };
  reader.readAsText(file);
}

/* ====== Settings modal ====== */
function openSettings(){
  const existing=document.getElementById('settingsBg'); if(existing){ existing.remove(); return; }
  const d=document.createElement('div'); d.id='settingsBg'; d.className='modal-bg';
  d.innerHTML=`<div class="modal">
    <h2>⚙ GitHub Gist Settings</h2>
    <p>Your data is stored in a private GitHub Gist. Configure once per browser — then all changes save automatically.</p>
    <div class="modal-field"><label>Personal Access Token</label><input id="cfg_token" type="password" value="${CFG.token}" placeholder="ghp_xxxxxxxxxxxx"></div>
    <div class="modal-field"><label>Gist ID</label><input id="cfg_gist" value="${CFG.gistId}" placeholder="a1b2c3d4e5f6…"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="cfgSave">Save & connect</button>
      <button class="btn-secondary" id="cfgTest">Test connection</button>
      <button class="btn-secondary" style="margin-left:auto" id="cfgClose">Cancel</button>
    </div>
    <div class="modal-msg" id="cfgMsg"></div>
  </div>`;
  document.body.appendChild(d);
  d.onclick=e=>{ if(e.target===d) d.remove(); };
  document.getElementById('cfgClose').onclick=()=>d.remove();
  document.getElementById('cfgSave').onclick=async()=>{
    CFG.token=document.getElementById('cfg_token').value.trim();
    CFG.gistId=document.getElementById('cfg_gist').value.trim();
    saveCfg();
    document.getElementById('cfgMsg').textContent='Saved. Testing…';
    await testConn(d);
  };
  document.getElementById('cfgTest').onclick=async()=>await testConn(d);
}
async function testConn(d){
  const msg=document.getElementById('cfgMsg');
  try{
    const r=await fetch(`https://api.github.com/gists/${CFG.gistId}`,{headers:{'Authorization':`token ${CFG.token}`}});
    if(r.ok){ msg.style.color='oklch(0.45 0.14 150)'; msg.textContent='✓ Connected! Reloading…'; setTimeout(()=>{ d.remove(); location.reload(); },1200); }
    else{ msg.style.color='oklch(0.52 0.16 28)'; msg.textContent=`✗ Error ${r.status} — check your token and Gist ID`; }
  }catch(e){ msg.style.color='oklch(0.52 0.16 28)'; msg.textContent='✗ Network error — check token and try again'; }
}

/* ====== Render ====== */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  const all=S.projects;
  const active=all.filter(p=>p.status==='Active').length;
  let openT=0,doneT=0; all.forEach(p=>p.tasks.forEach(t=>t.done?doneT++:openT++));

  // stat tiles
  document.getElementById('tiles').innerHTML=[
    {n:all.length,l:'Projects in play',color:'oklch(0.23 0.01 60)'},
    {n:active,l:'Active right now',color:STATUS_META['Active'].color},
    {n:openT,l:'Open tasks',color:'oklch(0.58 0.13 40)'},
    {n:doneT,l:'Tasks done',color:STATUS_META['Active'].color}
  ].map(t=>`<div class="tile"><div class="tile-n" style="color:${t.color}">${t.n}</div><div class="tile-l">${t.l}</div></div>`).join('');

  // subtitle
  document.getElementById('subtitle').innerHTML=`${all.length} projects · ${active} active <span>· changes save automatically</span>`;

  // filter
  const q=S.query.trim().toLowerCase();
  let list=all;
  if(S.filterStatus) list=list.filter(p=>p.status===S.filterStatus);
  if(S.filterCat) list=list.filter(p=>p.category===S.filterCat);
  if(q) list=list.filter(p=>p.name.toLowerCase().includes(q)||p.tasks.some(t=>t.t.toLowerCase().includes(q)));

  // sort
  const sortedList=[...list];
  const meta=p=>{ const tot=p.tasks.length,done=p.tasks.filter(t=>t.done).length; return{tot,done,open:tot-done,pct:tot?done/tot:0}; };
  sortedList.sort((a,b)=>{
    const am=meta(a),bm=meta(b),ai=all.indexOf(a),bi=all.indexOf(b);
    if(S.sort==='alpha') return a.name.toLowerCase().localeCompare(b.name.toLowerCase())||ai-bi;
    if(S.sort==='priority') return PRIO_META[a.priority].rank-PRIO_META[b.priority].rank||STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status)||ai-bi;
    if(S.sort==='open') return bm.open-am.open||ai-bi;
    if(S.sort==='progress') return bm.pct-am.pct||ai-bi;
    return STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status)||ai-bi;
  });

  // chips
  const mkChip=(label,count,color,isActive,pid,val,type)=>{
    const bg=isActive?tint(color,15):'white';
    const border=isActive?tint(color,45):'oklch(0.9 0.006 80)';
    const tc=isActive?'oklch(0.3 0.04 60)':'oklch(0.45 0.01 60)';
    const dot=color?`<span class="chip-dot" style="background:${color}"></span>`:'';
    return `<div class="chip${isActive?' active':''}" style="background:${bg};border-color:${border};color:${tc}" onclick="onChipClick('${type}','${val}')">${dot}${esc(label)} <span class="chip-count">${count}</span></div>`;
  };
  const noFilter=!S.filterStatus&&!S.filterCat;
  let chipsHtml=mkChip('All',all.length,'oklch(0.5 0.01 60)',noFilter,'','','all');
  chipsHtml+=`<div class="chip-divider"></div>`;
  chipsHtml+=STATUS_ORDER.map(s=>mkChip(s,all.filter(p=>p.status===s).length,STATUS_META[s].color,S.filterStatus===s,'','','status_'+s)).join('');
  chipsHtml+=`<div class="chip-divider"></div>`;
  chipsHtml+=CAT_ORDER.map(c=>mkChip(c,all.filter(p=>p.category===c).length,CAT_META[c].color,S.filterCat===c,'','','cat_'+c)).join('');
  document.getElementById('chips').innerHTML=chipsHtml;

  // cards
  const LIMIT=4;
  let cardsHtml=sortedList.map(p=>{
    const tot=p.tasks.length,done=p.tasks.filter(t=>t.done).length,pct=tot?Math.round(done/tot*100):0;
    const expanded=!!S.expanded[p.id], detailsOpen=!!S.details[p.id];
    const shown=expanded?p.tasks:p.tasks.slice(0,LIMIT);
    const hidden=Math.max(0,tot-LIMIT);
    const sm=STATUS_META[p.status]||STATUS_META['Active'];
    const pm=PRIO_META[p.priority]||PRIO_META['Medium'];
    const cm=CAT_META[p.category]||CAT_META['Business'];
    const cardBorder=p.priority==='High'?tint(pm.color,45):'oklch(0.91 0.006 80)';
    const statusSoft=tint(sm.color,12), statusBorder=tint(sm.color,38);

    const tasksHtml=shown.map(t=>`
      <div class="task-row">
        <span class="task-check${t.done?' done':''}" onclick="toggleTask('${p.id}','${t.id}')">${t.done?'✓':''}</span>
        <input class="task-input${t.done?' done':''}" value="${esc(t.t)}" onchange="setTaskText('${p.id}','${t.id}',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">
        <button class="task-del" onclick="deleteTask('${p.id}','${t.id}')">×</button>
      </div>`).join('');

    const detailsHtml=detailsOpen?`<div class="details-panel">
      <div class="details-row">
        <label class="field"><span class="field-label">Category</span>
          <select onchange="setCategory('${p.id}',this.value)">
            ${CAT_ORDER.map(c=>`<option value="${c}"${p.category===c?' selected':''}>${c}</option>`).join('')}
          </select></label>
        <label class="field"><span class="field-label">Priority</span>
          <select onchange="setPriority('${p.id}',this.value)">
            ${['High','Medium','Low'].map(v=>`<option value="${v}"${p.priority===v?' selected':''}>${v}</option>`).join('')}
          </select></label>
      </div>
      <label class="field"><span class="field-label">Notes</span>
        <textarea rows="2" onchange="setNote('${p.id}',this.value)" placeholder="Add a note or description…">${esc(p.note)}</textarea></label>
      <button class="del-link" onclick="confirmDelete('${p.id}','${esc(p.name)}')">Delete project</button>
    </div>`:'';

    return `<div class="card${p.priority==='High'?' card-high-border':''}" data-pid="${p.id}" style="border-color:${cardBorder}">
      <div class="card-top">
        <div class="card-meta">
          <button class="prio-btn" style="color:${pm.color}" onclick="cyclePriority('${p.id}')" title="Priority: ${p.priority} · click to change">${pm.glyph}</button>
          <div class="cat-label"><span class="cat-dot" style="background:${cm.color}"></span>${esc(p.category)}</div>
        </div>
        <div class="card-actions">
          <select class="status-select" style="color:${sm.color};background:${statusSoft};border-color:${statusBorder}" onchange="setStatus('${p.id}',this.value)">
            ${STATUS_ORDER.map(s=>`<option value="${s}"${p.status===s?' selected':''}>${s}</option>`).join('')}
          </select>
          <button class="delete-btn" onclick="confirmDelete('${p.id}','${esc(p.name)}')" title="Delete project">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
      <input class="card-title" value="${esc(p.name)}" placeholder="Untitled project" onchange="setName('${p.id}',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${tot?done+'/'+tot:'no tasks yet'}</div>
      </div>
      <div class="tasks">${tasksHtml}</div>
      ${tot===0&&!expanded?'<div class="empty-note">No tasks yet — add the first step below.</div>':''}
      <div class="card-footer">
        ${tot>LIMIT?`<button class="toggle-btn" onclick="toggleExpand('${p.id}')">${expanded?'Show less':'+ '+hidden+' more'}</button>`:''}
        <button class="details-btn" onclick="toggleDetails('${p.id}')">${detailsOpen?'Close details':'⚙ Details'}</button>
      </div>
      <div class="add-row">
        <span class="add-icon">+</span>
        <input class="add-input" placeholder="Add a task, press Enter" onkeydown="if(event.key==='Enter'&&this.value.trim()){addTask('${p.id}',this.value.trim());this.value=''}">
      </div>
      ${detailsHtml}
    </div>`;
  }).join('');

  cardsHtml+=`<div class="add-card" onclick="addProject()"><span style="font-size:20px;line-height:0">+</span> New project</div>`;

  if(sortedList.length===0){
    cardsHtml=`<div class="empty-state">No projects match your filters. <span onclick="clearFilters()">Clear filters</span></div>`;
  }

  document.getElementById('grid').innerHTML=cardsHtml;
}

function onChipClick(type,val){
  if(type==='all'){ S.filterStatus=null; S.filterCat=null; S.query=''; document.getElementById('searchInput').value=''; }
  else if(type.startsWith('status_')){ const s=type.slice(7); S.filterStatus=S.filterStatus===s?null:s; }
  else if(type.startsWith('cat_')){ const c=type.slice(4); S.filterCat=S.filterCat===c?null:c; }
  render();
}
function clearFilters(){ S.filterStatus=null; S.filterCat=null; S.query=''; document.getElementById('searchInput').value=''; render(); }
function confirmDelete(pid,name){ if(confirm(`Delete "${name||'this project'}" and all its tasks?`)) deleteProject(pid); }

/* ====== Boot ====== */
(async()=>{
  loadCfg();
  if(!isConfigured()){
    setSaveState('⚙ Click the gear to connect your GitHub Gist');
    S.projects=seedProjects();
    render();
    return;
  }
  setSaveState('loading from Gist…');
  try{
    const loaded=await gistGet();
    if(loaded&&Array.isArray(loaded.projects)&&loaded.projects.length){
      S.projects=loaded.projects;
      setSaveState('✓ loaded  '+new Date().toLocaleTimeString());
    } else {
      S.projects=seedProjects();
      setSaveState('first run — saving to Gist…');
      try{
        await gistSet({projects:S.projects});
        setSaveState('✓ saved  '+new Date().toLocaleTimeString());
      }catch(e){ setSaveState('✗ save error — check ⚙ settings'); }
    }
  }catch(e){
    setSaveState('✗ could not load — check ⚙ settings');
    S.projects=seedProjects();
  }
  render();
})();
</script>
